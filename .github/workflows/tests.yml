name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the requires-python floor; 3.12 covers the modern end.
        python-version: ["3.10", "3.12"]
    env:
      # GUI tests run headless (the test files also set this themselves).
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git history/tags.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        # Minimal system libs PyQt5 needs even on the offscreen platform.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run test suite
        run: pytest tests -q
