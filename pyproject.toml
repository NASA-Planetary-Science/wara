[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wara"
dynamic = ["version"]
description = "Gamma spectroscopy tools"
readme = "README.md"
authors = [
    {name = "Mauricio Ayllon Unzueta", email = "mauri.ayllon12@gmail.com"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# PEP 604 unions (str | None) are evaluated at import time in
# matplotlib_theme.py and apicalc.py, so 3.10 is a hard floor.
requires-python = ">=3.10"
dependencies = [
    "docopt >= 0.6.2",
    "lmfit > 1.0.2",
    "dateparser >= 1.1.1",
    "pandas > 1.4.2",
    "matplotlib >= 3.6.3",
    "mplcursors >= 0.5.2",
    "pyarrow >= 11.0.0",
    "natsort >= 7.1.1",
    "plotly >= 5.22.0",
    "scipy >= 1.9.3",
    "PyQt5 >= 5.15",
    "PyQtWebEngine",
    "msgspec",
    "bitstruct",
    "pds4_tools >= 1.3",
]

[project.urls]
Homepage = "https://github.com/NASA-Planetary-Science/wara"

[project.scripts]
wara = "wara.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wara*"]
# Namespace discovery is on by default, so it otherwise treats the ad-hoc
# mission-data script folders as packages and ships ~60 MB of raw .TAB/.dat
# datasets in the wheel. They are not importable package code.
exclude = ["wara.planetary-nuclear-spect*"]

[tool.setuptools.exclude-package-data]
# Needed in addition to the packages.find exclude above: include-package-data
# is on, so setuptools_scm's git-tracked file list would otherwise re-attach
# these ~60 MB of raw datasets as data files of the `wara` package.
wara = [
    "planetary-nuclear-spect/*",
    "planetary-nuclear-spect/*/*",
    "planetary-nuclear-spect/*/*/*",
]

[tool.setuptools.package-data]
wara = ["nuclear-data/*.txt", "nuclear-data/*.csv", "ui/*.png"]
"wara.planetary" = ["textures/*.png", "data/*.csv"]

[tool.setuptools_scm]
write_to = "wara/version.py"

[tool.pytest.ini_options]
# Only collect from tests/ — scratch/ contains test_*-named exploratory
# scripts that must never be picked up by a bare `pytest` run.
testpaths = ["tests"]

[tool.ruff]
# planetary-nuclear-spect holds ad-hoc mission-data scripts (not importable
# package code); scratch is exploratory.
extend-exclude = ["wara/planetary-nuclear-spect", "scratch"]

[tool.ruff.lint]
# E702: the GUI modules deliberately pair related Qt layout calls on one line
# (e.g. `lay.setContentsMargins(...); lay.setSpacing(8)`).
ignore = ["E702"]

[tool.ruff.lint.per-file-ignores]
# The package root re-exports its public API.
"wara/__init__.py" = ["F401", "F403"]
